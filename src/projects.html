<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarameloTeX</title>

    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="./styles/tailwind.css">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body class="min-h-screen bg-bg text-ink">

    <header class="h-14 flex items-center justify-between px-6 bg-panel border-b border-line">
        <div class="flex items-center gap-2.5">
            <img src="/img/caramelo_login.png" alt="" class="h-9">
            <span class="brand text-xl">CarameloTeX</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="texStatus" class="text-xs text-muted"></span>
            <button id="themeBtn" class="icon-btn" title="Tema">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" />
                </svg>
            </button>
        </div>
    </header>

    <main class="mx-auto px-6 py-10 max-w-4xl">

        <h1 class="brand text-3xl mb-6">Projetos</h1>

        <!-- Ações principais -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-12">
            <button id="openFolderBtn"
                class="text-left p-4 rounded-lg bg-primary text-primary-ink hover:bg-primary-hover transition-colors">
                <svg class="w-6 h-6 mb-3" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1M3 7v10a2 2 0 0 0 2 2h12.5a2 2 0 0 0 1.9-1.4l1.6-5A1.5 1.5 0 0 0 19.6 10H8.4a2 2 0 0 0-1.9 1.4L4 19" />
                </svg>
                <span class="block font-semibold">Abrir pasta</span>
                <span class="block text-sm opacity-80 mt-0.5">Um trabalho que já está no computador</span>
            </button>
            <a href="templates.html" class="card block p-4 hover:bg-hover transition-colors">
                <svg class="w-6 h-6 mb-3 text-accent-strong" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11v6M9 14h6" />
                </svg>
                <span class="block font-semibold">Novo projeto</span>
                <span class="block text-sm text-muted mt-0.5">Comece por um dos 11 modelos</span>
            </a>
            <button id="importZipBtn" class="card text-left p-4 hover:bg-hover transition-colors">
                <svg class="w-6 h-6 mb-3 text-accent-strong" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 15V4m0 0-4 4m4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
                </svg>
                <span class="block font-semibold">Importar ZIP</span>
                <span class="block text-sm text-muted mt-0.5">Extrai o projeto para uma pasta nova</span>
            </button>
            <input type="file" id="zipInput" accept=".zip" class="hidden">
        </div>

        <h2 class="text-sm font-semibold text-muted mb-3">Abertos recentemente</h2>

        <div id="projectsList" class="hidden card overflow-hidden">
            <div id="projectsListContent" class="divide-y divide-line"></div>
        </div>

        <div id="emptyState" class="hidden card text-center py-12 px-6">
            <img src="/img/caramelo_loading.png" alt="" class="h-20 mx-auto mb-4">
            <p class="font-medium">Nenhum projeto aberto ainda.</p>
            <p class="text-sm text-muted mt-1">Abra a pasta do seu trabalho ou crie um projeto a partir de um modelo.</p>
        </div>

    </main>

    <!-- Preparação do LaTeX na primeira execução -->
    <div id="setupOverlay" class="hidden fixed inset-0 bg-bg z-50 flex items-center justify-center">
        <div class="text-center max-w-md px-6">
            <img src="/img/caramelo_loading.png" alt="" class="h-32 mx-auto mb-6">
            <p class="text-lg font-medium mb-1">Preparando o LaTeX pela primeira vez</p>
            <p class="text-muted text-sm mb-5">Isso só acontece uma vez e leva cerca de um minuto.</p>
            <div class="w-full bg-line rounded-full h-1.5 overflow-hidden">
                <div id="setupProgress" class="bg-accent h-1.5 rounded-full transition-all" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <script type="module" src="./js/projects-page.js"></script>
</body>

</html>
