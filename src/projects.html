<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarameloTeX</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./styles/tailwind.css">

    <!-- Custom Styles (Reuse main.css) -->
    <link rel="stylesheet" href="styles/main.css">

    <script type="module" src="./vendor/tauri-bridge.js"></script>
    <script type="module" src="./vendor/zip-lib.js"></script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-latex-dark border-b border-gray-700 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="/img/caramelo_login.png" alt="" class="h-10">
            <h1 class="text-2xl font-bold text-latex-green">CarameloTeX</h1>
        </div>
        <div id="texStatus" class="text-xs text-gray-500"></div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl">

        <!-- Ações principais -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
            <button id="openFolderBtn"
                class="bg-latex-green hover:bg-teal-600 text-white p-5 rounded-lg font-semibold transition-colors flex flex-col items-center space-y-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"></path>
                </svg>
                <span>Abrir pasta</span>
            </button>
            <a href="templates.html"
                class="bg-gray-700 hover:bg-gray-600 text-white p-5 rounded-lg font-semibold transition-colors flex flex-col items-center space-y-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>Novo projeto</span>
            </a>
            <button id="importZipBtn"
                class="bg-gray-700 hover:bg-gray-600 text-white p-5 rounded-lg font-semibold transition-colors flex flex-col items-center space-y-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
                <span>Importar ZIP</span>
            </button>
            <input type="file" id="zipInput" accept=".zip" class="hidden">
        </div>

        <h2 class="text-xl font-semibold text-gray-200 mb-4">Projetos recentes</h2>

        <!-- Lista de recentes -->
        <div id="projectsList" class="hidden bg-gray-800 border border-gray-700 rounded-lg overflow-hidden">
            <div id="projectsListContent" class="divide-y divide-gray-700"></div>
        </div>

        <!-- Vazio -->
        <div id="emptyState" class="hidden text-center py-16 text-gray-500">
            <p class="text-lg">Nenhum projeto aberto ainda.</p>
            <p class="text-sm mt-2">Abra uma pasta com arquivos .tex ou crie um projeto a partir de um template.</p>
        </div>

    </main>

    <!-- Preparação do LaTeX na primeira execução -->
    <div id="setupOverlay" class="hidden fixed inset-0 bg-gray-900 bg-opacity-95 z-50 flex items-center justify-center">
        <div class="text-center max-w-md px-6">
            <img src="/img/caramelo_loading.png" alt="" class="h-32 mx-auto mb-6">
            <p class="text-gray-200 text-lg mb-2">Preparando o LaTeX pela primeira vez...</p>
            <p class="text-gray-500 text-sm mb-4">Isso só acontece uma vez e pode levar alguns minutos.</p>
            <div class="w-full bg-gray-700 rounded-full h-2">
                <div id="setupProgress" class="bg-latex-green h-2 rounded-full transition-all" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script defer src="/js/storage.js"></script>
    <script>
        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type} text-sm font-medium`;
            toast.textContent = message;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // Scripts com defer e módulos rodam antes do DOMContentLoaded.
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('openFolderBtn').addEventListener('click', openFolder);
            document.getElementById('importZipBtn').addEventListener('click', () => document.getElementById('zipInput').click());
            document.getElementById('zipInput').addEventListener('change', (e) => {
                if (e.target.files.length > 0) importZip(e.target.files[0]);
                e.target.value = '';
            });

            await renderProjects();
            await prepareTex();
        });

        async function prepareTex() {
            const status = document.getElementById('texStatus');
            const overlay = document.getElementById('setupOverlay');
            const bar = document.getElementById('setupProgress');
            try {
                const tex = await StorageService.prepareTex((done, total) => {
                    overlay.classList.remove('hidden');
                    bar.style.width = `${Math.round((done / total) * 100)}%`;
                });
                const labels = { bundled: 'LaTeX embutido (TinyTeX)', system: 'LaTeX do sistema', custom: 'LaTeX configurado' };
                status.textContent = tex ? labels[tex.source] || tex.source : 'Nenhum LaTeX encontrado';
                status.className = tex ? 'text-xs text-gray-500' : 'text-xs text-red-400';
                status.title = tex ? tex.binDir : 'Reinstale o CarameloTeX ou instale o MiKTeX/TeX Live.';
            } catch (e) {
                status.textContent = 'Erro ao preparar o LaTeX';
                status.className = 'text-xs text-red-400';
                status.title = String(e);
                console.error(e);
            } finally {
                overlay.classList.add('hidden');
            }
        }

        async function renderProjects() {
            const projects = await StorageService.listRecent();
            const list = document.getElementById('projectsList');
            const listContent = document.getElementById('projectsListContent');
            const emptyState = document.getElementById('emptyState');

            listContent.innerHTML = '';
            list.classList.toggle('hidden', projects.length === 0);
            emptyState.classList.toggle('hidden', projects.length > 0);

            projects.forEach(project => {
                const row = document.createElement('div');
                row.className = 'p-4 hover:bg-gray-700/50 transition-colors cursor-pointer group flex items-center justify-between';

                const date = new Date(project.lastOpened).toLocaleDateString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                row.innerHTML = `
                    <div class="flex items-center space-x-4 flex-1 min-w-0">
                        <div class="p-2 bg-latex-gray rounded-lg flex-shrink-0">
                            <svg class="w-6 h-6 text-latex-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                            </svg>
                        </div>
                        <div class="min-w-0 flex-1">
                            <h3 class="text-gray-200 font-medium truncate project-name"></h3>
                            <p class="text-xs text-gray-500 truncate project-path"></p>
                            <p class="text-xs text-gray-600">Aberto em ${escapeHtml(date)}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 flex-shrink-0 ml-4">
                        <button class="reveal-btn text-gray-500 hover:text-blue-400 p-2 opacity-0 group-hover:opacity-100 transition-all rounded hover:bg-gray-600" title="Mostrar no Explorer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </button>
                        <button class="remove-btn text-gray-500 hover:text-red-400 p-2 opacity-0 group-hover:opacity-100 transition-all rounded hover:bg-gray-600" title="Remover da lista (não apaga a pasta)">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                        <button class="open-btn bg-latex-green hover:bg-teal-600 text-white px-3 py-1.5 rounded text-sm font-medium transition-colors">
                            Abrir
                        </button>
                    </div>
                `;

                const h3 = row.querySelector('.project-name');
                h3.textContent = project.name;
                const pathEl = row.querySelector('.project-path');
                pathEl.textContent = project.path;
                pathEl.title = project.path;

                row.querySelector('.reveal-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    StorageService.revealInExplorer(project.path, '').catch(err => showToast(String(err), 'error'));
                });
                row.querySelector('.remove-btn').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await StorageService.removeRecent(project.path);
                    await renderProjects();
                });
                row.querySelector('.open-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openProject(project.path);
                });
                row.addEventListener('click', () => openProject(project.path));

                listContent.appendChild(row);
            });
        }

        async function openProject(path) {
            try {
                await StorageService.openProject(path);
                window.location.href = 'index.html';
            } catch (e) {
                console.error(e);
                if (confirm(`Não foi possível abrir a pasta:\n${e}\n\nRemover dos projetos recentes?`)) {
                    await StorageService.removeRecent(path);
                    await renderProjects();
                }
            }
        }

        async function openFolder() {
            const path = await StorageService.pickFolder('Abrir pasta do projeto LaTeX');
            if (path) await openProject(path);
        }

        async function importZip(file) {
            const name = prompt('Nome da pasta do novo projeto:', file.name.replace(/\.zip$/i, ''));
            if (!name) return;
            const parent = await StorageService.pickFolder('Onde criar a pasta do projeto?');
            if (!parent) return;

            try {
                await StorageService.createProject(parent, name, {});
                const result = await StorageService.importZip(file);
                showToast(`${result.added} arquivo(s) importado(s)`, 'success');
                window.location.href = 'index.html';
            } catch (e) {
                console.error(e);
                showToast(`Erro ao importar: ${e}`, 'error');
            }
        }
    </script>
</body>

</html>
