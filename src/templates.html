<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos - CarameloTeX</title>

    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="./styles/tailwind.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .category-btn {
            padding: 0.35rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--panel);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .category-btn:hover {
            color: var(--text);
        }

        .category-btn.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 500;
        }
    </style>
</head>

<body class="min-h-screen bg-bg text-ink">

    <header class="h-14 flex items-center justify-between px-6 bg-panel border-b border-line">
        <a href="projects.html" class="flex items-center gap-2.5" title="Voltar para os projetos">
            <img src="/img/caramelo_login.png" alt="" class="h-9">
            <span class="brand text-xl">CarameloTeX</span>
        </a>
        <a href="projects.html" class="btn">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 18l-6-6 6-6" />
            </svg>
            Voltar
        </a>
    </header>

    <main class="mx-auto px-6 py-10 max-w-5xl">

        <h1 class="brand text-3xl mb-1">Novo projeto</h1>
        <p class="text-muted mb-6">Escolha um modelo. Você decide em que pasta ele vai ser criado.</p>

        <div class="flex flex-col md:flex-row gap-4 md:items-center justify-between mb-8">
            <div class="flex gap-2 flex-wrap">
                <button class="category-btn active" data-category="all">Todos</button>
                <button class="category-btn" data-category="academic">Acadêmico</button>
                <button class="category-btn" data-category="thesis">Teses</button>
                <button class="category-btn" data-category="presentation">Apresentações</button>
                <button class="category-btn" data-category="professional">Profissional</button>
            </div>
            <div class="relative w-full md:w-72">
                <svg class="w-4 h-4 text-muted absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor"
                    stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
                <input type="search" id="searchInput" placeholder="Buscar modelos" aria-label="Buscar modelos"
                    class="w-full h-9 pl-9 pr-3 rounded-lg bg-panel border border-line text-sm placeholder:text-muted focus:outline-none focus:border-accent">
            </div>
        </div>

        <div id="templatesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div id="emptyState" class="hidden text-center py-16 text-muted">
            Nenhum modelo encontrado para essa busca.
        </div>

    </main>

    <!-- Prévia do modelo -->
    <div id="previewModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-panel border border-line rounded-lg max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-soft"
            role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="flex justify-between items-center px-5 py-3 border-b border-line">
                <h3 id="modalTitle" class="text-lg font-semibold"></h3>
                <button id="closeModal" class="icon-btn" title="Fechar">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="flex-1 overflow-auto p-4 bg-bg">
                <pre id="modalCode" class="font-mono text-sm whitespace-pre-wrap"></pre>
            </div>
            <div class="px-5 py-3 border-t border-line flex justify-end gap-2">
                <button id="copyCodeBtn" class="btn">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="9" y="9" width="11" height="11" rx="2" />
                        <path d="M5 15V6a2 2 0 0 1 2-2h9" />
                    </svg>
                    Copiar código
                </button>
                <button id="useTemplateBtn" class="btn btn-primary">Usar este modelo</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/templates.js"></script>
</body>

</html>
