<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarameloTeX</title>

    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="./styles/tailwind.css">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body class="h-screen overflow-hidden flex flex-col bg-bg text-ink">

    <!-- Cabeçalho -->
    <header class="h-12 flex-shrink-0 flex items-center justify-between gap-4 px-3 bg-panel border-b border-line">
        <div class="flex items-center gap-2 min-w-0">
            <button id="toggleFilesBtn" class="icon-btn" title="Mostrar ou esconder os arquivos (Ctrl+B)">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="16" rx="2" />
                    <path d="M9 4v16" />
                </svg>
            </button>
            <a href="projects.html" class="brand text-lg text-ink hover:text-accent-strong px-1" title="Voltar para os projetos">CarameloTeX</a>
            <span class="text-line">/</span>
            <span id="projectName" class="text-sm font-medium truncate max-w-xs"></span>
            <button id="revealProjectBtn" class="icon-btn" title="Abrir a pasta do projeto no Explorer">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
                </svg>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <select id="engineSelect" class="select" title="Compilador LaTeX">
                <option value="pdflatex">pdfLaTeX</option>
                <option value="xelatex">XeLaTeX</option>
                <option value="lualatex">LuaLaTeX</option>
            </select>

            <label class="flex items-center gap-2 px-1 text-sm text-muted cursor-pointer select-none"
                title="Compilar sozinho enquanto você escreve">
                <input type="checkbox" id="autoCompile" class="sr-only">
                <span class="switch" aria-hidden="true"></span>
                Auto
            </label>

            <button id="compileBtn" class="btn btn-primary" title="Salvar e compilar (Ctrl+S)">
                <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />
                </svg>
                <span id="compileBtnText">Compilar</span>
            </button>

            <button id="downloadBtn" class="icon-btn" title="Salvar PDF como..." disabled>
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" />
                </svg>
            </button>

            <button id="packagesBtn" class="icon-btn" title="Pacotes LaTeX: ver instalados, buscar e instalar">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 7.5 12 3 3 7.5m18 0v9L12 21m9-13.5L12 12m0 9-9-4.5v-9M12 21v-9M3 7.5 12 12m4.5-6.75-9 4.5" />
                </svg>
            </button>

            <button id="themeBtn" class="icon-btn" title="Tema">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Área principal -->
    <main class="flex-1 flex min-h-0">

        <!-- Barra lateral -->
        <aside id="filesPanel" class="w-60 flex-shrink-0 flex flex-col bg-panel2 border-r border-line">
            <div class="pane-header bg-panel2">
                <div class="tabs" role="tablist" aria-label="Barra lateral">
                    <button id="tabFiles" class="tab" role="tab" aria-selected="true" aria-controls="fileList">Arquivos</button>
                    <button id="tabOutline" class="tab" role="tab" aria-selected="false" aria-controls="outlineList">Sumário</button>
                </div>
                <div id="fileActions" class="flex items-center">
                    <button id="addFolderBtn" class="icon-btn" title="Nova pasta">
                        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5" />
                        </svg>
                    </button>
                    <button id="addFileBtn" class="icon-btn" title="Adicionar arquivos do computador">
                        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11v6M9 14h6" />
                        </svg>
                    </button>
                    <button id="uploadZipBtn" class="icon-btn" title="Importar arquivos de um .zip">
                        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 15V4m0 0-4 4m4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="fileList" class="flex-1 overflow-y-auto p-1.5" role="tabpanel"></div>
            <div id="outlineList" class="hidden flex-1 overflow-y-auto p-1.5" role="tabpanel"></div>

            <input type="file" id="fileUploadInput" class="hidden" multiple>
            <input type="file" id="zipUploadInput" class="hidden" accept=".zip">
        </aside>

        <!-- Editor -->
        <section id="editorPanel" class="w-1/2 flex flex-col min-w-[300px] bg-panel">
            <div id="editorToolbar" class="toolbar" role="toolbar" aria-label="Formatação"></div>
            <div id="editor" class="flex-1 min-h-0 overflow-hidden"></div>
        </section>

        <div id="resizer"></div>

        <!-- PDF -->
        <section id="viewerPanel" class="w-1/2 flex flex-col min-w-[300px] bg-pdf">
            <div class="pane-header">
                <div class="flex items-center gap-2 min-w-0">
                    <div id="loadingSpinner" class="hidden">
                        <svg class="animate-spin h-4 w-4 text-accent" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                    </div>
                    <span id="compileStatus" class="truncate">Aguardando compilação</span>
                </div>
                <div class="flex items-center">
                    <button id="zoomOutBtn" class="icon-btn" title="Diminuir zoom (Ctrl + roda do mouse)">
                        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
                    </button>
                    <span id="zoomLabel" class="w-11 text-center tabular-nums text-xs">100%</span>
                    <button id="zoomInBtn" class="icon-btn" title="Aumentar zoom (Ctrl + roda do mouse)">
                        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
                    </button>
                    <button id="zoomFitBtn" class="icon-btn" title="Ajustar à largura" aria-pressed="true">
                        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3" /></svg>
                    </button>
                    <span class="w-px h-5 bg-line mx-1"></span>
                    <button id="toggleLogsBtn" class="icon-btn" title="Ver erros e avisos"></button>
                </div>
            </div>

            <div class="flex-1 overflow-auto" id="pdfViewerContainer">
                <div id="pdfPlaceholder" class="h-full flex items-center justify-center text-muted">
                    <div class="text-center">
                        <img src="/img/caramelo_loading.png" alt="" class="h-24 mx-auto mb-4 opacity-80">
                        <p>Clique em <strong>Compilar</strong> para gerar o PDF.</p>
                    </div>
                </div>
                <div id="pdfPagesContainer" class="hidden"></div>
            </div>

            <div id="logsContainer" class="hidden flex-1 overflow-auto p-4 bg-bg">
                <div id="logsContent" class="space-y-2">
                    <p class="text-muted text-center mt-10">Nenhum erro ou aviso.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Barra de status -->
    <footer class="status-bar flex-shrink-0">
        <span id="editorStatus">Pronto</span>
        <span id="lineCount">Linhas: 1</span>
        <span class="flex-1"></span>
        <button id="spellBtn" class="status-toggle" aria-pressed="true">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 15 7.5 6 11 15M5.3 12h4.4M13 13l3 3 5-7" />
            </svg>
            Ortografia
        </button>
        <button id="wordCount" class="hover:text-ink" title="Ver a contagem detalhada por seção"></button>
        <span id="pageCount"></span>
    </footer>

    <div id="toastContainer" class="fixed bottom-10 right-4 space-y-2 z-50"></div>

    <!-- Menu de contexto dos arquivos -->
    <div id="actionMenu" class="menu hidden fixed z-50"></div>

    <!-- Carregando -->
    <div id="editorLoadingOverlay" class="fixed inset-0 bg-bg flex items-center justify-center z-50">
        <div class="text-center">
            <img src="/img/caramelo_loading.png" alt="" class="h-28 mx-auto mb-4">
            <p class="text-muted">Abrindo o projeto...</p>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
