# Gera o instalador do CarameloTeX a partir do código do repositório, assina
# com a SignPath (quando configurada) e cria a release como rascunho.
#
# Dispara ao enviar uma tag de versão (git tag v0.4.0 && git push origin v0.4.0)
# ou manualmente pela aba Actions (só gera o instalador, sem release).
#
# O LaTeX (TinyTeX) não vai no instalador: o app baixa na 1ª execução a partir
# da release tinytex-* (veja o workflow tinytex.yml).
#
# Secrets e variáveis do repositório (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY e TAURI_SIGNING_PRIVATE_KEY_PASSWORD (secrets):
#     chave do atualizador; assinam o instalador e geram o latest.json que o
#     app consulta para se atualizar. Obrigatórios para criar a release.
#   SIGNPATH_API_TOKEN (secret) e SIGNPATH_ORGANIZATION_ID,
#   SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG (variáveis):
#     assinatura do Windows; sem eles, o instalador sai sem essa assinatura.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "A tag $env:GITHUB_REF_NAME não bate com a versão do package.json ($version)"
          }

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Gerar instalador
        run: npm run tauri build

      - name: Renomear instalador
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw 'Instalador não encontrado' }
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item $exe.FullName unsigned/CarameloTeX-setup-x64.exe

      - name: Enviar instalador sem assinatura
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: instalador-sem-assinatura
          path: unsigned/CarameloTeX-setup-x64.exe
          if-no-files-found: error

      # A SignPath pede aprovação manual de cada assinatura: aprove pelo painel
      # dela em até 4 horas, senão o passo falha.
      - name: Assinar com a SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed

      # Depois da assinatura do Windows (que altera o arquivo): assina para o
      # atualizador e gera o latest.json que o app consulta.
      - name: Preparar atualização automática
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Falta o secret TAURI_SIGNING_PRIVATE_KEY (chave do atualizador)' }
          New-Item -ItemType Directory -Force release | Out-Null
          $source = if (Test-Path 'signed/CarameloTeX-setup-x64.exe') { 'signed' } else {
            Write-Warning 'Instalador sem assinatura do Windows (SignPath não configurada)'
            'unsigned'
          }
          Copy-Item "$source/CarameloTeX-setup-x64.exe" release/
          npx tauri signer sign release/CarameloTeX-setup-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao assinar para o atualizador' }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $manifest = [ordered]@{
            version  = $version
            notes    = "Veja as novidades em https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content release/CarameloTeX-setup-x64.exe.sig -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/CarameloTeX-setup-x64.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content release/latest.json -Encoding utf8NoBOM
          Get-Content release/latest.json

      - name: Criar release (rascunho)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME release/CarameloTeX-setup-x64.exe release/latest.json `
            --draft --title "CarameloTeX $version" --generate-notes
