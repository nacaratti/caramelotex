<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Templates - LaTeX Editor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'latex-green': '#008080',
                        'latex-dark': '#1a1a2e',
                        'latex-gray': '#16213e',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-latex-dark border-b border-gray-700 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <a href="projects.html" class="text-2xl font-bold text-latex-green hover:text-teal-400 transition-colors">LaTeX Editor</a>
            <span class="text-sm text-gray-400">Biblioteca de Templates</span>
        </div>
        <a href="projects.html"
            class="text-gray-400 hover:text-latex-green transition-colors p-2 rounded-lg hover:bg-gray-800 flex items-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"></path>
            </svg>
            <span class="text-sm">Voltar aos Projetos</span>
        </a>
    </header>

    <main class="container mx-auto px-4 py-8">

        <!-- Search and Filter -->
        <div class="mb-8">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <input type="text" id="searchInput" placeholder="Buscar templates..."
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 pl-10 text-gray-200 focus:outline-none focus:border-latex-green">
                    <svg class="w-5 h-5 text-gray-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div class="flex gap-2 flex-wrap justify-center">
                    <button class="category-btn active px-4 py-2 rounded-lg text-sm font-medium transition-colors" data-category="all">
                        Todos
                    </button>
                    <button class="category-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors" data-category="academic">
                        Academico
                    </button>
                    <button class="category-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors" data-category="thesis">
                        Teses
                    </button>
                    <button class="category-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors" data-category="presentation">
                        Apresentacoes
                    </button>
                    <button class="category-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors" data-category="professional">
                        Profissional
                    </button>
                </div>
            </div>
        </div>

        <!-- Templates Grid -->
        <div id="templatesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Templates will be populated by JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <svg class="w-20 h-20 text-gray-700 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-gray-500 text-lg">Nenhum template encontrado.</p>
        </div>

    </main>

    <!-- Template Preview Modal -->
    <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-75 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-gray-700">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-200"></h3>
                <button id="closeModal" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="flex-1 overflow-auto p-4">
                <pre id="modalCode" class="bg-gray-900 p-4 rounded-lg text-sm text-gray-300 font-mono whitespace-pre-wrap overflow-x-auto"></pre>
            </div>
            <div class="p-4 border-t border-gray-700 flex justify-end gap-3">
                <button id="copyCodeBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Copiar Codigo
                </button>
                <button id="useTemplateBtn" class="px-4 py-2 bg-latex-green hover:bg-teal-600 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Usar Template
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js?v=3"></script>
    <script src="js/storage.js?v=3"></script>
    <script src="js/templates.js"></script>

    <style>
        .category-btn {
            background-color: #374151;
            color: #9ca3af;
        }
        .category-btn:hover {
            background-color: #4b5563;
            color: #e5e7eb;
        }
        .category-btn.active {
            background-color: #008080;
            color: white;
        }
        .template-card {
            transition: all 0.2s ease;
        }
        .template-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</body>

</html>
