<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Templates - CarameloTeX Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'latex-green': '#008080',
                        'latex-dark': '#1a1a2e',
                        'latex-gray': '#16213e',
                    }
                }
            }
        }
    </script>

    <style>
        .CodeMirror {
            height: 100%;
            font-size: 14px;
        }
        .template-item.active {
            background-color: rgba(0, 128, 128, 0.2);
            border-color: #008080;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: #374151;
            border-radius: 9999px;
            font-size: 12px;
        }
        .tag-chip button {
            opacity: 0.7;
        }
        .tag-chip button:hover {
            opacity: 1;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-latex-dark border-b border-gray-700 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <a href="projects.html" class="text-2xl font-bold text-latex-green hover:text-teal-400 transition-colors">
                CarameloTeX
            </a>
            <span class="text-sm text-gray-400 bg-red-900/30 px-2 py-1 rounded">Admin</span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="projects.html" class="text-gray-400 hover:text-white transition-colors text-sm">
                Voltar ao Editor
            </a>
            <button id="logoutBtn"
                class="text-gray-400 hover:text-red-400 transition-colors p-2 rounded-lg hover:bg-gray-800"
                title="Sair">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-latex-dark border-r border-gray-700 min-h-[calc(100vh-73px)]">
            <nav class="p-4 space-y-2">
                <a href="admin.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="admin-templates.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-latex-green/20 text-latex-green border border-latex-green/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z">
                        </path>
                    </svg>
                    <span>Templates</span>
                </a>
                <a href="admin-users.html"
                    class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <span>Usuarios</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content - Split View -->
        <main class="flex-1 flex">
            <!-- Templates List (Left) -->
            <div class="w-80 border-r border-gray-700 flex flex-col">
                <div class="p-4 border-b border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-200">Templates</h2>
                        <button id="newTemplateBtn"
                            class="bg-latex-green hover:bg-teal-600 text-white px-3 py-1.5 rounded text-sm font-medium transition-colors flex items-center space-x-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            <span>Novo</span>
                        </button>
                    </div>
                    <input type="text" id="searchTemplates" placeholder="Buscar templates..."
                        class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-latex-green">
                </div>

                <div id="templatesList" class="flex-1 overflow-y-auto p-2 space-y-1">
                    <!-- Loading -->
                    <div class="animate-pulse space-y-2">
                        <div class="h-16 bg-gray-800 rounded"></div>
                        <div class="h-16 bg-gray-800 rounded"></div>
                        <div class="h-16 bg-gray-800 rounded"></div>
                    </div>
                </div>
            </div>

            <!-- Template Editor (Right) -->
            <div class="flex-1 flex flex-col">
                <!-- Empty state -->
                <div id="editorEmpty" class="flex-1 flex items-center justify-center">
                    <div class="text-center text-gray-500">
                        <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6z">
                            </path>
                        </svg>
                        <p>Selecione um template para editar</p>
                        <p class="text-sm mt-2">ou clique em "Novo" para criar</p>
                    </div>
                </div>

                <!-- Editor Form -->
                <div id="editorForm" class="flex-1 flex flex-col hidden">
                    <!-- Toolbar -->
                    <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <h2 id="editorTitle" class="text-lg font-semibold text-gray-200">Novo Template</h2>
                            <span id="editorStatus" class="text-xs text-gray-500"></span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button id="previewBtn"
                                class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm transition-colors flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                    </path>
                                </svg>
                                <span>Preview</span>
                            </button>
                            <button id="saveBtn"
                                class="bg-latex-green hover:bg-teal-600 text-white px-4 py-1.5 rounded text-sm font-medium transition-colors flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M5 13l4 4L19 7"></path>
                                </svg>
                                <span>Salvar</span>
                            </button>
                            <button id="deleteBtn"
                                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm transition-colors hidden">
                                Excluir
                            </button>
                        </div>
                    </div>

                    <!-- Form Fields -->
                    <div class="p-4 border-b border-gray-700 grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Nome</label>
                            <input type="text" id="templateName" placeholder="Nome do template"
                                class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-latex-green">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Categoria</label>
                            <select id="templateCategory"
                                class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-latex-green">
                                <option value="academic">Academico</option>
                                <option value="thesis">Teses</option>
                                <option value="presentation">Apresentacoes</option>
                                <option value="professional">Profissional</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm text-gray-400 mb-1">Descricao</label>
                            <textarea id="templateDescription" rows="2" placeholder="Descricao do template"
                                class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-latex-green resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Icone</label>
                            <select id="templateIcon"
                                class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-latex-green">
                                <option value="document">Documento</option>
                                <option value="academic">Academico</option>
                                <option value="book">Livro</option>
                                <option value="presentation">Apresentacao</option>
                                <option value="user">Usuario</option>
                                <option value="mail">Email</option>
                                <option value="currency">Moeda</option>
                            </select>
                        </div>
                        <div class="flex items-center space-x-4">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="templateActive" checked
                                    class="w-4 h-4 rounded bg-gray-800 border-gray-700 text-latex-green focus:ring-latex-green">
                                <span class="text-sm text-gray-300">Ativo</span>
                            </label>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm text-gray-400 mb-1">Tags (Enter para adicionar)</label>
                            <div class="flex flex-wrap gap-2 p-2 bg-gray-800 border border-gray-700 rounded min-h-[40px]">
                                <div id="tagsContainer" class="flex flex-wrap gap-1"></div>
                                <input type="text" id="tagInput" placeholder="Nova tag..."
                                    class="flex-1 min-w-[100px] bg-transparent border-none outline-none text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- CodeMirror Editor -->
                    <div class="flex-1 flex flex-col min-h-0">
                        <div class="px-4 py-2 border-b border-gray-700 bg-gray-800/50">
                            <span class="text-sm text-gray-400">Conteudo LaTeX</span>
                        </div>
                        <div id="editorContainer" class="flex-1"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-lg w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                <h3 class="text-lg font-semibold">Preview do Template</h3>
                <button id="closePreview" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="previewContent" class="flex-1 overflow-auto p-4">
                <div id="previewLoading" class="flex items-center justify-center h-64">
                    <div class="flex items-center space-x-3 text-gray-400">
                        <svg class="animate-spin h-6 w-6" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span>Compilando...</span>
                    </div>
                </div>
                <div id="previewPdf" class="hidden">
                    <canvas id="pdfCanvas" class="mx-auto shadow-lg"></canvas>
                </div>
                <div id="previewError" class="hidden text-red-400 p-4 bg-red-900/20 rounded">
                    <p class="font-semibold mb-2">Erro na compilacao:</p>
                    <pre id="previewErrorText" class="text-sm whitespace-pre-wrap"></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/stex/stex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>
    <script>
        // State
        let editor = null;
        let currentTemplateId = null;
        let allTemplates = [];
        let currentTags = [];

        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            const isAdmin = await AdminService.requireAdmin();
            if (!isAdmin) return;

            document.getElementById('logoutBtn').addEventListener('click', () => AuthService.signOut());

            initEditor();
            await loadTemplates();
            setupEventListeners();
        });

        function initEditor() {
            editor = CodeMirror(document.getElementById('editorContainer'), {
                value: '',
                mode: 'stex',
                theme: 'dracula',
                lineNumbers: true,
                lineWrapping: true,
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                styleActiveLine: true,
                matchBrackets: true,
            });
        }

        async function loadTemplates() {
            allTemplates = await TemplateService.listTemplates({ includeInactive: true });
            renderTemplatesList(allTemplates);
        }

        function renderTemplatesList(templates) {
            const list = document.getElementById('templatesList');

            if (templates.length === 0) {
                list.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        <p>Nenhum template encontrado</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = templates.map(t => `
                <div class="template-item p-3 rounded-lg border border-gray-700 hover:border-gray-600 cursor-pointer transition-colors ${t.id === currentTemplateId ? 'active' : ''}"
                     data-id="${t.id}">
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-medium text-gray-200 truncate">${escapeHtml(t.name)}</span>
                        ${t.is_active ? '' : '<span class="text-xs text-red-400">Inativo</span>'}
                    </div>
                    <div class="text-xs text-gray-500 truncate">${escapeHtml(t.description || 'Sem descricao')}</div>
                    <div class="text-xs text-gray-600 mt-1">${getCategoryLabel(t.category)}</div>
                </div>
            `).join('');

            // Click handlers
            list.querySelectorAll('.template-item').forEach(item => {
                item.addEventListener('click', () => loadTemplate(item.dataset.id));
            });
        }

        async function loadTemplate(id) {
            const template = allTemplates.find(t => t.id === id);
            if (!template) return;

            currentTemplateId = id;

            // Update UI
            document.getElementById('editorEmpty').classList.add('hidden');
            document.getElementById('editorForm').classList.remove('hidden');
            document.getElementById('editorTitle').textContent = template.name;
            document.getElementById('deleteBtn').classList.remove('hidden');

            // Fill form
            document.getElementById('templateName').value = template.name;
            document.getElementById('templateDescription').value = template.description || '';
            document.getElementById('templateCategory').value = template.category;
            document.getElementById('templateIcon').value = template.icon || 'document';
            document.getElementById('templateActive').checked = template.is_active;

            // Tags
            currentTags = Array.isArray(template.tags) ? [...template.tags] : [];
            renderTags();

            // Content
            editor.setValue(template.content || '');

            // Highlight in list
            document.querySelectorAll('.template-item').forEach(item => {
                item.classList.toggle('active', item.dataset.id === id);
            });
        }

        function newTemplate() {
            currentTemplateId = null;

            document.getElementById('editorEmpty').classList.add('hidden');
            document.getElementById('editorForm').classList.remove('hidden');
            document.getElementById('editorTitle').textContent = 'Novo Template';
            document.getElementById('deleteBtn').classList.add('hidden');

            // Clear form
            document.getElementById('templateName').value = '';
            document.getElementById('templateDescription').value = '';
            document.getElementById('templateCategory').value = 'academic';
            document.getElementById('templateIcon').value = 'document';
            document.getElementById('templateActive').checked = true;

            currentTags = [];
            renderTags();

            editor.setValue(`\\documentclass{article}
\\usepackage[utf8]{inputenc}

\\title{Novo Template}
\\author{Autor}
\\date{\\today}

\\begin{document}

\\maketitle

\\section{Introducao}

Conteudo aqui...

\\end{document}`);

            // Remove highlight from list
            document.querySelectorAll('.template-item').forEach(item => {
                item.classList.remove('active');
            });
        }

        async function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            if (!name) {
                showToast('Nome e obrigatorio', 'error');
                return;
            }

            const content = editor.getValue().trim();
            if (!content) {
                showToast('Conteudo e obrigatorio', 'error');
                return;
            }

            const templateData = {
                name,
                description: document.getElementById('templateDescription').value.trim(),
                category: document.getElementById('templateCategory').value,
                icon: document.getElementById('templateIcon').value,
                is_active: document.getElementById('templateActive').checked,
                tags: currentTags,
                content
            };

            document.getElementById('editorStatus').textContent = 'Salvando...';

            let result;
            if (currentTemplateId) {
                result = await TemplateService.updateTemplate(currentTemplateId, templateData);
            } else {
                result = await TemplateService.createTemplate(templateData);
                if (result) currentTemplateId = result.id;
            }

            if (result) {
                showToast('Template salvo com sucesso!', 'success');
                document.getElementById('editorStatus').textContent = 'Salvo';
                document.getElementById('deleteBtn').classList.remove('hidden');
                await loadTemplates();

                // Re-highlight
                document.querySelectorAll('.template-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.id === currentTemplateId);
                });
            } else {
                showToast('Erro ao salvar template', 'error');
                document.getElementById('editorStatus').textContent = 'Erro';
            }

            setTimeout(() => {
                document.getElementById('editorStatus').textContent = '';
            }, 3000);
        }

        async function deleteTemplate() {
            if (!currentTemplateId) return;

            if (!confirm('Tem certeza que deseja excluir este template?')) return;

            const result = await TemplateService.deleteTemplate(currentTemplateId);

            if (result) {
                showToast('Template excluido', 'success');
                currentTemplateId = null;
                document.getElementById('editorEmpty').classList.remove('hidden');
                document.getElementById('editorForm').classList.add('hidden');
                await loadTemplates();
            } else {
                showToast('Erro ao excluir template', 'error');
            }
        }

        // Tags
        function renderTags() {
            const container = document.getElementById('tagsContainer');
            container.innerHTML = currentTags.map((tag, i) => `
                <span class="tag-chip">
                    ${escapeHtml(tag)}
                    <button type="button" data-index="${i}" class="remove-tag">&times;</button>
                </span>
            `).join('');

            container.querySelectorAll('.remove-tag').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentTags.splice(parseInt(btn.dataset.index), 1);
                    renderTags();
                });
            });
        }

        // Preview
        async function showPreview() {
            const content = editor.getValue();
            if (!content.trim()) {
                showToast('Conteudo vazio', 'error');
                return;
            }

            const modal = document.getElementById('previewModal');
            const loading = document.getElementById('previewLoading');
            const pdfDiv = document.getElementById('previewPdf');
            const errorDiv = document.getElementById('previewError');

            modal.classList.remove('hidden');
            loading.classList.remove('hidden');
            pdfDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');

            try {
                const API_URL = (typeof LATEX_API_URL !== 'undefined' && LATEX_API_URL) ? LATEX_API_URL : 'https://latex.ytotech.com';

                const response = await fetch(API_URL + '/builds/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'pdflatex',
                        resources: [{ main: true, content }]
                    })
                });

                const contentType = response.headers.get('content-type') || '';

                if (response.ok && contentType.includes('pdf')) {
                    const pdfData = await response.arrayBuffer();
                    await renderPdfPreview(new Uint8Array(pdfData));
                    loading.classList.add('hidden');
                    pdfDiv.classList.remove('hidden');
                } else if (response.ok && contentType.includes('json')) {
                    const data = await response.json();
                    if (data.pdf) {
                        const pdfBytes = Uint8Array.from(atob(data.pdf), c => c.charCodeAt(0));
                        await renderPdfPreview(pdfBytes);
                        loading.classList.add('hidden');
                        pdfDiv.classList.remove('hidden');
                    } else {
                        throw new Error(data.error || data.logs || 'Erro desconhecido');
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.logs || errorData.error || `HTTP ${response.status}`);
                }
            } catch (error) {
                loading.classList.add('hidden');
                errorDiv.classList.remove('hidden');
                document.getElementById('previewErrorText').textContent = error.message;
            }
        }

        async function renderPdfPreview(pdfData) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
            const page = await pdf.getPage(1);
            const scale = 1.5;
            const viewport = page.getViewport({ scale });

            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport }).promise;
        }

        // Event Listeners
        function setupEventListeners() {
            document.getElementById('newTemplateBtn').addEventListener('click', newTemplate);
            document.getElementById('saveBtn').addEventListener('click', saveTemplate);
            document.getElementById('deleteBtn').addEventListener('click', deleteTemplate);
            document.getElementById('previewBtn').addEventListener('click', showPreview);

            // Close preview
            document.getElementById('closePreview').addEventListener('click', () => {
                document.getElementById('previewModal').classList.add('hidden');
            });
            document.getElementById('previewModal').addEventListener('click', (e) => {
                if (e.target.id === 'previewModal') {
                    document.getElementById('previewModal').classList.add('hidden');
                }
            });

            // Search
            document.getElementById('searchTemplates').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = allTemplates.filter(t =>
                    t.name.toLowerCase().includes(query) ||
                    (t.description && t.description.toLowerCase().includes(query))
                );
                renderTemplatesList(filtered);
            });

            // Tags input
            document.getElementById('tagInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = e.target.value.trim();
                    if (value && !currentTags.includes(value)) {
                        currentTags.push(value);
                        renderTags();
                    }
                    e.target.value = '';
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (!document.getElementById('editorForm').classList.contains('hidden')) {
                        saveTemplate();
                    }
                }
            });
        }

        // Helpers
        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function getCategoryLabel(category) {
            const labels = { academic: 'Academico', thesis: 'Teses', presentation: 'Apresentacoes', professional: 'Profissional' };
            return labels[category] || category;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                warning: 'bg-yellow-600',
                info: 'bg-blue-600'
            };
            toast.className = `${colors[type]} text-white px-4 py-2 rounded shadow-lg text-sm`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>

</html>
