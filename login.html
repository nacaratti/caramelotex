<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LaTeX Editor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'latex-green': '#008080',
                        'latex-dark': '#1a1a2e',
                        'latex-gray': '#16213e',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md px-6">
        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-latex-green mb-2">LaTeX Editor</h1>
            <p class="text-gray-400 text-sm">Edite e compile documentos LaTeX online</p>
        </div>

        <!-- Card -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-8 shadow-xl">

            <!-- Tab Toggle -->
            <div class="flex mb-6 bg-gray-900 rounded-lg p-1">
                <button id="tabSignIn"
                    class="flex-1 py-2 text-sm font-semibold rounded-md transition-colors bg-latex-green text-white"
                    onclick="switchTab('signin')">
                    Entrar
                </button>
                <button id="tabSignUp"
                    class="flex-1 py-2 text-sm font-semibold rounded-md transition-colors text-gray-400 hover:text-white"
                    onclick="switchTab('signup')">
                    Criar Conta
                </button>
            </div>

            <!-- Form -->
            <form id="authForm" onsubmit="handleSubmit(event)">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm text-gray-300 mb-1">Email</label>
                        <input type="email" id="email" required autocomplete="email"
                            class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:border-latex-green focus:ring-1 focus:ring-latex-green transition-colors"
                            placeholder="seu@email.com">
                    </div>

                    <div>
                        <label for="password" class="block text-sm text-gray-300 mb-1">Senha</label>
                        <input type="password" id="password" required minlength="6" autocomplete="current-password"
                            class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:border-latex-green focus:ring-1 focus:ring-latex-green transition-colors"
                            placeholder="Mínimo 6 caracteres">
                    </div>

                    <!-- Error Message -->
                    <div id="errorMsg" class="hidden text-red-400 text-sm bg-red-900/30 border border-red-800 rounded-lg p-3"></div>

                    <!-- Success Message -->
                    <div id="successMsg" class="hidden text-green-400 text-sm bg-green-900/30 border border-green-800 rounded-lg p-3"></div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-latex-green hover:bg-teal-600 text-white py-3 rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="submitBtnText">Entrar</span>
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-gray-600 text-xs mt-6">LaTeX Editor MVP</p>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js?v=3"></script>
    <script src="js/storage.js?v=3"></script>

    <script>
        let currentMode = 'signin'; // 'signin' | 'signup'

        // If already logged in, redirect
        (async () => {
            const session = await AuthService.getSession();
            if (session) {
                // Run migration from localStorage if needed
                await StorageService.migrateFromLocalStorage();
                window.location.href = 'projects.html';
            }
        })();

        function switchTab(mode) {
            currentMode = mode;
            const tabSignIn = document.getElementById('tabSignIn');
            const tabSignUp = document.getElementById('tabSignUp');
            const submitBtnText = document.getElementById('submitBtnText');
            const passwordInput = document.getElementById('password');

            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('successMsg').classList.add('hidden');

            if (mode === 'signin') {
                tabSignIn.className = 'flex-1 py-2 text-sm font-semibold rounded-md transition-colors bg-latex-green text-white';
                tabSignUp.className = 'flex-1 py-2 text-sm font-semibold rounded-md transition-colors text-gray-400 hover:text-white';
                submitBtnText.textContent = 'Entrar';
                passwordInput.autocomplete = 'current-password';
            } else {
                tabSignUp.className = 'flex-1 py-2 text-sm font-semibold rounded-md transition-colors bg-latex-green text-white';
                tabSignIn.className = 'flex-1 py-2 text-sm font-semibold rounded-md transition-colors text-gray-400 hover:text-white';
                submitBtnText.textContent = 'Criar Conta';
                passwordInput.autocomplete = 'new-password';
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtnText.textContent = currentMode === 'signin' ? 'Entrando...' : 'Criando conta...';

            try {
                if (currentMode === 'signin') {
                    const { session, error } = await AuthService.signIn(email, password);
                    if (error) throw error;

                    // Migrate localStorage data after first sign-in
                    await StorageService.migrateFromLocalStorage();

                    window.location.href = 'projects.html';
                } else {
                    const { session, user, error } = await AuthService.signUp(email, password);
                    if (error) throw error;

                    if (session) {
                        // Auto-confirmed (e.g., email confirmation disabled)
                        await StorageService.migrateFromLocalStorage();
                        window.location.href = 'projects.html';
                    } else {
                        // Needs email confirmation
                        successMsg.textContent = 'Conta criada! Verifique seu email para confirmar o cadastro.';
                        successMsg.classList.remove('hidden');
                    }
                }
            } catch (err) {
                const message = err.message || 'Erro desconhecido';
                errorMsg.textContent = translateError(message);
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtnText.textContent = currentMode === 'signin' ? 'Entrar' : 'Criar Conta';
            }
        }

        function translateError(msg) {
            if (msg.includes('Invalid login credentials')) return 'Email ou senha incorretos.';
            if (msg.includes('User already registered')) return 'Este email já está cadastrado.';
            if (msg.includes('Password should be at least')) return 'A senha deve ter pelo menos 6 caracteres.';
            if (msg.includes('Unable to validate email')) return 'Email inválido.';
            if (msg.includes('Email rate limit exceeded')) return 'Muitas tentativas. Aguarde alguns minutos.';
            return msg;
        }
    </script>
</body>

</html>
